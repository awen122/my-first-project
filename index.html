<body>
    <h1 id="title">我的灵感画框</h1>
    
    <div id="imageContainer" style="margin: 20px; min-height: 200px;">
        <img id="magicImage" src="" style="max-width: 300px; border-radius: 10px; display: none;">
    </div>

    <p id="quote" style="font-style: italic; color: #666;"></p>
    
    <button onclick="changeMagic()">触发灵感升级</button>

    <script>
        async function changeMagic() {
            const title = document.getElementById('title');
            const img = document.getElementById('magicImage');
            const quote = document.getElementById('quote');
            
            title.innerText = '正在调取全球灵感...';
            
            try {
                // 1. 同时调用两个接口（图片和文字）
                // 随机图地址，每次加一个随机参数防止浏览器缓存
                const randomId = Math.floor(Math.random() * 1000);
                const imageUrl = `https://picsum.photos/300/200?random=${randomId}`;
                
                const textRes = await fetch('https://v1.hitokoto.cn/');
                const textData = await textRes.json();

                // 2. 更新界面
                img.src = imageUrl;
                img.style.display = 'block'; // 显示图片
                quote.innerText = `“ ${textData.hitokoto} ”`;
                title.innerText = '灵感已送达！';
                
            } catch (error) {
                title.innerText = '网络断开啦！';
            }
        }
    </script>
</body>


    <h1 id="title">我的第一个应用</h1>
    <button onclick="changeMagic()">点我变魔术</button>

    <script>
        // JavaScript 部分：负责动作
        function changeMagic() {
            const title = document.getElementById('title');
            // 点击后改变文字颜色并放大
            title.style.color = '#ea4335'; // 变成红色
            title.innerText = '🎉 哇！hhh!阿颜真是个大傻B！';
            title.style.transform = 'scale(1.2)';
            
            // 弹出提示框
            alert('恭喜你，这行代码就是“交互”的核心！');
        }
    </script>

</body>
</html>

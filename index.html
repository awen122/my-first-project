<body>
    <h1>小笨蛋来玩吧！</h1>
    
    <div style="margin: 20px;">
        <img id="magicImage" src="" style="max-width: 300px; border-radius: 10px; display: none;">
    </div>
    
    <button onclick="showImage()">带你看好看的</button>

    <script>
        function showImage() {
            const img = document.getElementById('magicImage');
            img.src = 'magic.jpg';
            img.style.display = 'block';
        }
    </script>
</body>
